spring.application.name=order-service
server.port=8082

# Kredensial dibaca dari infra/.env (salinan infra/.env.example) atau
# dari environment variable dengan nama yang sama.
spring.config.import=optional:file:infra/.env[.properties],\
    optional:file:../infra/.env[.properties]

spring.datasource.url=\
    jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
spring.datasource.username=${ORDER_DB_USER:orders}
spring.datasource.password=${ORDER_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
# Default true (OSIV): koneksi bisa tertahan sampai respons selesai
# ditulis. Dimatikan: koneksi hanya dipakai selama transaksi.
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Eksperimen Hari 4 (default false). Setiap request dilayani virtual
# thread, jadi jumlah request bersamaan tidak lagi dibatasi
# server.tomcat.threads.max (200); yang membatasi kini
# server.tomcat.max-connections (default 8192), pool koneksi database,
# dan layanan yang dipanggil. Pantau: jvm.threads.live, Hikari pending,
# dan event JFR jdk.VirtualThreadPinned.
spring.threads.virtual.enabled=true

clients.catalog.base-url=http://${CATALOG_HOST:localhost}:8081
clients.catalog.connect-timeout=500ms
clients.catalog.read-timeout=1s
clients.catalog.max-concurrent-calls=10
clients.pricing.base-url=\
    http://${PRICING_HOST:localhost}:${PRICING_PORT:8083}
clients.pricing.client-id=order-service
clients.pricing.client-secret=${PRICING_CLIENT_SECRET:}
# Default HttpClient JDK: tanpa batas waktu. Batas dipilih dari latensi
# pricing yang teramati (p99,9 sekitar 250 ms) dengan margin; pantau
# metrik http.client.requests dan jumlah respons 504.
clients.pricing.connect-timeout=500ms
clients.pricing.read-timeout=1s

# Actuator hanya membuka endpoint yang aman
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram\
    .http.server.requests=true

# Metrik, trace, dan log dikirim lewat OTLP ke grafana/otel-lgtm
management.otlp.metrics.export.url=\
    http://${OTEL_HOST:localhost}:4318/v1/metrics
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.otlp.endpoint=\
    http://${OTEL_HOST:localhost}:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=\
    http://${OTEL_HOST:localhost}:4318/v1/logs
management.tracing.sampling.probability=1.0
