spring.application.name=catalog-service
server.port=8081

# Kredensial dibaca dari infra/.env (salinan infra/.env.example) atau
# dari environment variable dengan nama yang sama.
spring.config.import=optional:file:infra/.env[.properties],\
    optional:file:../infra/.env[.properties]

spring.datasource.url=\
    jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db
spring.datasource.username=${CATALOG_DB_USER:catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
# Default true (OSIV): EntityManager dan koneksi bisa tertahan sampai
# respons selesai ditulis, dan lazy loading diam-diam terjadi saat
# serialisasi JSON. Dimatikan: semua data dimuat di dalam service.
spring.jpa.open-in-view=false
# Default false: JOIN FETCH koleksi + paginasi hanya memberi peringatan
# HHH90003004 lalu memotong halaman di memori. True: langsung gagal.
spring.jpa.properties.hibernate.query\
    .fail_on_pagination_over_collection_fetch=true
spring.mvc.problemdetails.enabled=true

# Batch insert (default: tanpa batch). order_inserts mengelompokkan
# INSERT per tabel; reWriteBatchedInserts membuat driver PostgreSQL
# mengirim satu INSERT multi-baris per batch.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Actuator hanya membuka endpoint yang aman
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram\
    .http.server.requests=true

# Metrik, trace, dan log dikirim lewat OTLP ke grafana/otel-lgtm
management.otlp.metrics.export.url=\
    http://${OTEL_HOST:localhost}:4318/v1/metrics
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.otlp.endpoint=\
    http://${OTEL_HOST:localhost}:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=\
    http://${OTEL_HOST:localhost}:4318/v1/logs
management.tracing.sampling.probability=1.0
