# Profil untuk menjalankan service di container (infra/compose.yaml,
# profil bench).

# Level log mengikuti default (INFO). DEBUG, show-sql, dan TRACE
# parameter SQL hanya untuk sesi debugging lokal: semuanya menulis ke
# log di setiap request, dan TRACE parameter ikut mencatat data pengguna.

# Di bawah beban, 10% trace sudah cukup untuk melihat pola
management.tracing.sampling.probability=0.1
